name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev", "test" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar proyecto con Maven
      run: |
        # Detecta si el proyecto está dentro de la carpeta Academico o en la raíz
        if [ -d "Academico" ]; then
          cd Academico
        elif [ -d "backend" ]; then
          cd backend
        fi
        chmod +x mvnw
        ./mvnw clean compile -B
